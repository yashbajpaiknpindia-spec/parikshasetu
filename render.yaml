# Render Blueprint — one-click deploy of Merit Marg with a real Postgres backend.
# Render dashboard → New → Blueprint → point at this repo.
# See RENDER_DEPLOY.md for the manual (non-blueprint) steps and post-deploy checklist.

databases:
  - name: pariksha-setu-db
    plan: free
    databaseName: pariksha_setu
    user: pariksha_setu

services:
  - type: web
    name: pariksha-setu
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: pariksha-setu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      # Optional integrations — leave blank to keep those features in demo mode.
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PASS_SECRET
        generateValue: true
      - key: NOTIFICATIONS_FEED_URL
        sync: false
      # Google sign-in — leave both blank to keep the "Continue with Google"
      # button hidden. See .env.example / RENDER_DEPLOY.md for setup steps.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
